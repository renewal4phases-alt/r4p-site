<!DOCTYPE html>

<head>

  <style>
    body {
      font-family: Arial;
      background: #111;
      color: #fff;

      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
    }

    .big {
      font-size: 24px;
      font-weight: bold;
    }
  </style>

<body>

<h1>R4P Operational Dashboard</h1>

<div class="card">
  <div class="big">Applications</div>
  <p>Collected via Formspree (email inbox or later database upgrade)</p>
</div>

<div class="card">
  <div class="big">Support / Donations</div>
  <p>Track incoming support requests (money, equipment, space)</p>
</div>

<div class="card">
  <div class="big">System Status</div>
  <p>Stage: BUILD PHASE (No physical infrastructure yet)</p>
</div>
