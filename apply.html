<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply | R4P</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <h1>R4P Application Intake</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="program.html">Program</a>
    <a href="about.html">About</a>
    <a href="apply.html">Apply</a>
    <a href="donate.html">Get Involved</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>

<section>

  <h2>Application Intake</h2>

  <p>
    Complete the form below to begin the intake process.
  </p>

</section>

<section>

  <label>Full Name</label><br><br>
  <input type="text" name="name" placeholder="Your Full Name">

  <br><br>

  <label>Email Address</label><br><br>
  <input type="email" name="email" placeholder="Your Email">

  <br><br>

  <label>Current Situation</label><br><br>
  <textarea name="situation" rows="6"></textarea>

  <br><br>

  <label>Goals</label><br><br>
  <textarea name="goals" rows="5"></textarea>

  <br><br>

  <label>Readiness</label><br><br>
  <select name="readiness">
    <option value="ready">Ready</option>
    <option value="unsure">Unsure</option>
    <option value="not_ready">Not Ready</option>
  </select>

  <br><br>

  <button type="button" onclick="submitApplication()">
    Submit Application
  </button>

</section>

</main>

<!-- Firebase goes here next -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
</body>
</html>
