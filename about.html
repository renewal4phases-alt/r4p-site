<header>

  <nav>

<main>

<section>

  <h2>Application Intake</h2>

  <p>
    Complete the form below to begin the intake process.
  </p>

</section>

<section>

<form action="https://formspree.io/f/mvzyrllr" method="POST">

  <label>Full Name</label>
  <br><br>

  <input type="text"
  name="name"
  placeholder="Your Full Name">

  <br><br>

  <label>Email Address</label>
  <br><br>

  <input type="email"
  name="email"
  placeholder="Your Email">

  <br><br>

  <label>Current Situation</label>
  <br><br>

  <textarea
  name="situation"
  rows="6"
  placeholder="Tell us about your current situation"></textarea>

  <br><br>

  <label>Goals</label>
  <br><br>

  <textarea
  name="goals"
  rows="5"
  placeholder="What are your goals?"></textarea>

  <br><br>

  <button type="submit">
    Submit Application
  </button>

</form>

</section>

</main>

<footer>
  <p>Renewal Four Phases © 2026</p>
</footer>
